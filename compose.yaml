name: quantforge
services:
  mongodb:
    image: mongo:8.0
    ports: ["127.0.0.1:27019:27017"]
    command: ["mongod", "--replSet", "quantforge", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch { rs.initiate({_id:'quantforge',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.adminCommand({hello:1}).isWritablePrimary) quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6381:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mongo-data:
  redis-data:
